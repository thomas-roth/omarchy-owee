[tool.ruff]
target-version = "py312"
exclude = ["reports", ".git", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
# Existing compact statements are deliberate; avoid unrelated formatting churn.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# CLI/QA entrypoints install their local module path or disable bytecode first.
"weather.py" = ["E402"]
"qa/city_search/run.py" = ["E402"]
"qa/international.py" = ["E402"]
"qa/live_maps.py" = ["E402"]
"qa/native_preferences/run.py" = ["E402"]
"qa/favorite_cities/run.py" = ["E402"]
"qa/ui_layout/run.py" = ["E402"]
"tests/test_hardening.py" = ["E402"]
"tests/test_production_backend.py" = ["E402"]
"tools/promote.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["network.py", "storage.py", "weather_data.py"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = [".", "tools"]
omit = ["tests/*", "qa/*", "reports/*", ".git/*"]
data_file = "reports/coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true
# Release scripts are namespace directories, and must not disappear as untested.
include_namespace_packages = true

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.coverage.html]
directory = "reports/coverage/html"
